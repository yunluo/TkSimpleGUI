[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TkSimpleGUI"
version = "0.1.0"
description = "TkSimpleGUI - zero-dependency object-oriented Tkinter GUI framework with a global event bus"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "yunluo", email = "sp91@qq.com"}]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.7"
dependencies = [
    "typing_extensions; python_version < '3.8'",
]
keywords = ["tkinter", "ttk", "gui", "ui", "event-driven", "declarative"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
    "ruff>=0.4",
    "typing_extensions; python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/yunluo/TkSimpleGUI"
Repository = "https://github.com/yunluo/TkSimpleGUI"

[project.scripts]
TkSimpleGUI = "TkSimpleGUI:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
TkSimpleGUI = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# hard per-test timeout: a hung modal dialog fails the test instead of
# stalling the whole suite ("thread" method marks it failed without
# hard-killing the interpreter)
timeout = 30
timeout_method = "thread"

[tool.ruff]
target-version = "py37"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    # Literal["a","b"] strings are flagged as forward references because ruff
    # cannot resolve the _typing_compat conditional import chain (33 false
    # positives across elements/*); the ty gate covers real typing errors.
    "F722",
]

[tool.ruff.lint.per-file-ignores]
# package-root __init__ intentionally imports after function definitions
# (module-shadowing rule: exported names shadow same-named submodules)
"src/TkSimpleGUI/__init__.py" = ["E402"]
"tests/*" = ["E402"]
# generated theme table: one theme dict per line, pure data
"src/TkSimpleGUI/_theme_data.py" = ["E501"]
# Literal[...] option strings (ttk option values) are flagged as undefined
# forward references because ruff cannot resolve the _typing_compat
# conditional import; only these four files use typed Literal options and
# the ty gate covers real typing errors in them
"src/TkSimpleGUI/elements/buttons.py" = ["F821"]
"src/TkSimpleGUI/elements/containers.py" = ["F821"]
"src/TkSimpleGUI/elements/data.py" = ["F821"]
"src/TkSimpleGUI/elements/misc.py" = ["F821"]
"src/TkSimpleGUI/elements/widgets.py" = ["F821"]

[tool.coverage.run]
source = ["TkSimpleGUI"]
omit = ["tests/*", "*__pycache__*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 90
