[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TkSimpleGUI"
version = "0.1.0"
description = "TkSimpleGUI - zero-dependency object-oriented Tkinter GUI framework with a global event bus"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "yunluo", email = "sp91@qq.com"}]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.7"
keywords = ["tkinter", "ttk", "gui", "ui", "event-driven", "declarative"]

[project.urls]
Homepage = "https://github.com/yunluo/TkSimpleGUI"
Repository = "https://github.com/yunluo/TkSimpleGUI"

[project.scripts]
TkSimpleGUI = "TkSimpleGUI:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
TkSimpleGUI = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["TkSimpleGUI"]
omit = ["tests/*", "*__pycache__*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 90
