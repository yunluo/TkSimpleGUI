[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TkSimpleGUI"
version = "0.1.0"
description = "TkSimpleGUI - zero-dependency object-oriented Tkinter GUI framework with a global event bus"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "yunluo", email = "sp91@qq.com"}]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.7"
dependencies = [
    "typing_extensions; python_version < '3.8'",
]
keywords = ["tkinter", "ttk", "gui", "ui", "event-driven", "declarative"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
    "ruff>=0.4",
    "typing_extensions; python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/yunluo/TkSimpleGUI"
Repository = "https://github.com/yunluo/TkSimpleGUI"

[project.scripts]
TkSimpleGUI = "TkSimpleGUI:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
TkSimpleGUI = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# hard per-test timeout: a hung modal dialog fails the test instead of
# stalling the whole suite ("thread" method marks it failed without
# hard-killing the interpreter)
timeout = 30
timeout_method = "thread"

[tool.ruff]
target-version = "py37"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PIE", "RET", "C4", "PL", "N"]
ignore = [
    # Literal["a","b"] strings are flagged as forward references because ruff
    # cannot resolve the _typing_compat conditional import chain (33 false
    # positives across elements/*); the ty gate covers real typing errors.
    "F722",
    # Imports inside functions are deliberate in this codebase: many
    # element modules lazily import from the window package to dodge
    # circular dependencies on first import.
    "PLC0415",
    # Element / Window classes legitimately take many constructor args
    # (size / padding / key / colors / fonts / callbacks ...). Splitting
    # them would just move the complexity into helper dataclasses.
    # PLR0917 is the positional twin of PLR0913 (ruff 0.17 enabled it);
    # positional construction is the layout call convention of this API.
    "PLR0913",
    "PLR0917",
    # Many update() and event handlers need many branches by design; a
    # wizard-style cascade is clearer than 12 nested ternaries.
    "PLR0912",
    # magic-value-comparison is noisy in tests (== "expected" everywhere)
    "PLR2004",
    # global is used for the two process-wide singletons (default_app,
    # input_blocker); see event.py / input_blocker.py.
    "PLW0603",
    # Test files use a free-form layout; let them.
    "N802", "N803", "N806", "N815",
    # Project convention: ``import constants as C`` / ``import enums as E``
    # appears in every module -- the short aliases are stable, intentional,
    # and shorter than the alternatives at every call site.
    "N812",
    # ``import TkSimpleGUI as sg`` is the ecosystem spelling users copy from
    # the docs; enforcing CamelCase module aliases there would break it.
    "N813",
    # PEP 263 coding declarations are deliberate policy: the 3.7 floor predates
    # UTF-8-default source encoding, and a file that gains non-ASCII text later
    # must already carry the declaration -- "unnecessary coding comment" is noise.
    "UP009",
]

[tool.ruff.lint.per-file-ignores]
# package-root __init__ intentionally imports after function definitions
# (module-shadowing rule: exported names shadow same-named submodules).
# N999 derives the module name from the CamelCase package directory itself
# (the ecosystem spelling -- same reasoning as the N813 ignore above).
"src/TkSimpleGUI/__init__.py" = ["E402", "N999"]
"src/TkSimpleGUI/__main__.py" = ["N999"]
"src/TkSimpleGUI/elements/__init__.py" = ["N999"]
"src/TkSimpleGUI/window/__init__.py" = ["N999"]
"tests/*" = ["E402"]
# generated theme table: one theme dict per line, pure data
"src/TkSimpleGUI/_theme_data.py" = ["E501"]
# configure_ttk is one declarative ttk style table per theme; splitting it
# would scatter related options across helpers for no readability gain.
"src/TkSimpleGUI/_theming.py" = ["PLR0915"]
# Literal[...] option strings (ttk option values) are flagged as undefined
# forward references because ruff cannot resolve the _typing_compat
# conditional import; only these four files use typed Literal options and
# the ty gate covers real typing errors in them
"src/TkSimpleGUI/elements/buttons.py" = ["F821"]
"src/TkSimpleGUI/elements/containers.py" = ["F821"]
"src/TkSimpleGUI/elements/data.py" = ["F821"]
"src/TkSimpleGUI/elements/widgets.py" = ["F821"]
# SystemTray wraps the Win32 Shell_NotifyIconW API verbatim; the public
# method names mirror the upstream Win32 spelling (ShowMessage, Update,
# Hide, UnHide) and we do not want to break that mapping.
"src/TkSimpleGUI/window/system_tray.py" = ["N802"]
# base.py is the re-export hub for the shared type aliases (submodules do
# ``from .base import Color``); the redundant-alias form marks that intent.
"src/TkSimpleGUI/elements/base.py" = ["PLC0414"]

[tool.coverage.run]
source = ["TkSimpleGUI"]
omit = ["tests/*", "*__pycache__*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 90
