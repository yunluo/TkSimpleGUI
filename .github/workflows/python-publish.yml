name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # 3.7 is the project floor (authoritative for the syntax gate);
        # 3.12 is the current interpreter used for development
        os: [windows-latest]
        python-version: ['3.7', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout ruff
          pip install -e .
      - name: Test suite (per-test 30s timeout)
        run: python -m pytest tests -q --timeout=30
      - name: Type gate (ty)
        if: matrix.python-version == '3.12'
        run: |
          pip install ty
          python tests/check_types.py
      - name: Syntax gate
        run: python tests/check_syntax.py
      - name: Lint gate (ruff)
        run: |
          pip install ruff
          ruff check src tests
      - name: Demo smoke
        run: python demos/showcase.py --smoke

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted PyPI publishing
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: |
          uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GH Release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
