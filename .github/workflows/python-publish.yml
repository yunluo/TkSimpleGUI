name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # 3.7 is the project floor (authoritative for the syntax gate);
        # 3.12 is the current interpreter used for development
        os: [windows-latest]
        python-version: ['3.7', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # ruff/ty pinned: newer releases add rules/diagnostics and break the
        # gates for reasons unrelated to the change under test
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout ruff==0.17.2
          pip install -e .
      - name: Test suite (per-test 30s timeout)
        run: python -m pytest tests -q --timeout=30
      - name: Type gate (ty)
        if: matrix.python-version == '3.12'
        run: |
          pip install ty==0.0.32
          python tests/check_types.py
      - name: Syntax gate
        run: python tests/check_syntax.py
      - name: Lint gate (ruff)
        run: |
          pip install ruff
          ruff check src tests
      - name: Demo smoke
        run: python demos/showcase.py --smoke

  # PyPI auto-publish on tags is TEMPORARILY disabled (2026-10-28).
  # To re-enable, restore the deploy job from git history (this commit).
